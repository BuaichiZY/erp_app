name: ERP
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ERP:
    type: application
    platform: iOS
    sources:
      - path: ERP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sex.erp.ios
        CURRENT_PROJECT_VERSION: 9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ERP/Info.plist
      properties:
        CFBundleDisplayName: ERP
        CFBundleShortVersionString: "1.4.5"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [zh-Hans, zh-Hant, en, ja, ko]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: "仅在扫描名片二维码时使用相机。"
        NSMicrophoneUsageDescription: "仅在录制聊天语音时使用麦克风。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ERPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ERPTests
    dependencies:
      - target: ERP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sex.erp.ios.tests
