name: ERP
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ERP:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - ERPTests
        - ERPLayoutUITests
    sources:
      - path: ERP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sex.erp.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
    info:
      path: ERP/Info.plist
      properties:
        CFBundleDisplayName: ERP
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "仅在扫描名片二维码时使用相机。"
        NSMicrophoneUsageDescription: "仅在录制聊天语音时使用麦克风。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ERPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ERPTests
    dependencies:
      - target: ERP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sex.erp.ios.tests
  ERPLayoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ERPLayoutUITests
    dependencies:
      - target: ERP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sex.erp.ios.layouttests
