name: iOS build
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build iPhone and iPad simulator app
        run: xcodebuild -project ios/ERP.xcodeproj -scheme ERP -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Archive iPhone and iPad device app without signing
        run: xcodebuild -project ios/ERP.xcodeproj -scheme ERP -configuration Release -destination 'generic/platform=iOS' -archivePath ios/ERP.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Validate iPad Playground package
        run: |
          for file in ios/ERP/*.swift; do cmp "$file" "ios/ERP-iPad.swiftpm/Sources/ERP/$(basename "$file")"; done
          cmp ios/Playground.Package.swift ios/ERP-iPad.swiftpm/Package.swift
          grep -q 'iOSApplication' ios/ERP-iPad.swiftpm/Package.swift
      - name: Upload Xcode project and simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ERP-iOS-project-and-simulator
          path: |
            ios/ERP.xcodeproj
            ios/DerivedData/Build/Products/Debug-iphonesimulator/ERP.app
            ios/ERP.xcarchive
          if-no-files-found: warn
